  <!-- Structured Data: FAQPage -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [{
      "@type": "Question",
      "name": "What does Aaghaz Foundation do?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Aaghaz helps students from low-income families in India continue their education. We help with school and college fees and other essential educational costs, while also providing mentoring, counselling and educational support."
      }
    },{
      "@type": "Question",
      "name": "How do you select students for support?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Every application goes through a verification process. Our volunteers review the documents provided, visit the student's home and, where necessary, verify information with their school or college. We consider the family's financial circumstances, the student's academic record and other relevant factors before assistance is approved."
      }
    },{
      "@type": "Question",
      "name": "Are donations tax-deductible in India?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Eligible donations may qualify for deduction under Section 80G of the Income-tax Act, subject to applicable rules. Aaghaz issues receipts for eligible donations."
      }
    },{
      "@type": "Question",
      "name": "How can I volunteer?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Our volunteers help verify applications, stay in touch with students, provide mentoring and support our educational programmes. You can register through our website or contact us to find out how you can help."
      }
    }]
  }
  </script>
